name: Cluster deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: string
      image-tags:
        description: "Docker image with tag"
        required: true
        type: string

jobs:
  deploy-to-cluster:
    name: Deploy to Cluster
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bake manifests with Kustomize
        id: bake
        uses: azure/k8s-bake@bf8bfd33b007edea820fe80983239bca24012239
        with:
          renderEngine: "kustomize"
          kustomizationPath: "kustomize/overlays/${{ inputs.environment }}"

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: "${{ secrets[format('AKS_{0}_FINT_GITHUB', inputs.environment )] }}"

      - name: Set the target cluster
        uses: azure/aks-set-context@883bdc8d8d1d0fd87e66cc4ba6f0b618f9eb5281
        with:
          cluster-name: "${{ vars[format('{0}_CLUSTER_NAME', inputs.environment)] }}"
          resource-group: "${{ vars[format('{0}_CLUSTER_RESOURCE_GROUP', inputs.environment)] }}"
          admin: "true"
          use-kubelogin: "true"

      - name: Deploy
        uses: azure/k8s-deploy@bf1ec05e1d736ac4ac70bae889d3ec48c79e2213
        with:
          action: deploy
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: ${{ inputs.image-tags }}
          pull-images: "false"
          namespace: operators
