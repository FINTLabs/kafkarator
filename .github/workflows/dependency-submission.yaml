name: Submit Dependency Graph

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/buildSrc/**"
      - "**/gradle.properties"
      - "**/gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/dependency-submission.yaml"
  schedule:
    - cron: "20 3 * * 0,3,5"

jobs:
  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.4.1
        with:
          build-root-directory: .
