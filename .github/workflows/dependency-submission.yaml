name: Submit Dependency Graph

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "**/buildSrc/**"
      - "**/gradle.properties"
      - "**/gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/dependency-submission.yaml"
  schedule:
    - cron: "20 3 * * 0,3,5"

jobs:
  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          build-root-directory: .
